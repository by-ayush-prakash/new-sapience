[build]
  publish = "."

# These draft sections are intentionally unavailable in production.
[[redirects]]
  from = "/careers"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/careers.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/careers/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sustainability"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sustainability.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sustainability/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/careers*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/sustainability*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
