[build]
  publish = "."

[[redirects]]
  from = "/symmatrics-letter-of-intent.html"
  to = "/symmatrics-letter-of-intent"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/platform.html"
  to = "/platform"
  status = 301
  force = true

[[redirects]]
  from = "/sectors.html"
  to = "/sectors"
  status = 301
  force = true

[[redirects]]
  from = "/deployment.html"
  to = "/deployment"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/news.html"
  to = "/news"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/disclaimer.html"
  to = "/disclaimer"
  status = 301
  force = true

[[redirects]]
  from = "/under-the-hood.html"
  to = "/under-the-hood"
  status = 301
  force = true

[[redirects]]
  from = "/instruments-of-virtue.html"
  to = "/instruments-of-virtue"
  status = 301
  force = true

# These draft sections are intentionally unavailable in production.
[[redirects]]
  from = "/careers"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/careers.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/careers/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sustainability"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sustainability.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sustainability/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/careers*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/sustainability*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
